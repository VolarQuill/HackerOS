<!DOCTYPE html>
<html>
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>HackerOS</title>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>

        <div class="applist">
            <div class="notes"><img></div>
            <div class="calculator"><img></div>

        </div>


        <p class="title">Welcome to HackerOS</p>

        <div class="searchdiv"><input type="text" name="q"  placeholder="How to hack fbi..." required class="search">

        </div>
